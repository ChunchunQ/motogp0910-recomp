# MotoGP 09/10 with supplied title update, version 0.0.1.1.
# The original XEX and sibling default.xexp are loaded by ReXGlue together.
[project]
# The SDK stamps its API floor here; sdk-version.json pins the exact nightly.
name = "motogp0910"
sdk_version = "0.10.0"
game_root = "assets/game-tu"

[entrypoint]
file_path = "assets/game-tu/default.xex"
out_directory_path = "generated/default"
includes = []

[entrypoint.functions]
# TU version only: leaf FP routine starts with fabs f13,f1 at 82709EE0.
# Two return paths end at 82709FB4 and 82709FD4. The next routine starts
# at 82709FD8. Wrapper at 8270A0A0 sets r4=1 and branches here.
0x82709EE0 = { end = 0x82709FD8 }
# CRT notification callback registered by 8270EAD0 via lis/addi + stw,
# then called indirectly by 823B1840. No standard prologue: cmpwi cr6,r3,0;
# bnelr cr6; b 8270EA60. The next independent routine begins at 8270DF14.
0x8270DF08 = { end = 0x8270DF14 }
# Indirect list comparator encountered during shader/resource startup. This
# leaf has no prologue; its equality return is at 825006D0 and its less/greater
# return is at 825006E4. The next function's pdata entry is 825006E8.
0x82500660 = { end = 0x825006E8 }
# Bink's lock-release callback: loads the embedded lock's vtable and tail-calls
# slot +20. Six instructions, ending in bctr at 825F9BF4, before pdata 825F9BF8.
0x825F9BE0 = { end = 0x825F9BF8 }

# Missing entries from the TU CRT initializer table at 82874614..8287B5B4.
# Each routine loads a static registry node/name/payload/size and tail-calls
# 82384B98. End boundaries are taken from the actual terminal branch, not padding.
